name: Daily Data Update

on:
  schedule:
    # Run at 00:01 UTC every day.
    # Note: GitHub Actions schedule can be delayed.
    - cron: '1 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests schedule python-dotenv flask

      - name: Run Data Calculator
        env:
          # Secrets must be configured in Repo Settings > Secrets and variables > Actions
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
        run: |
          # Use the --run-now flag to execute immediately instead of waiting for scheduler
          python hpr_calculator.py --run-now

      - name: Rebuild Static Site
        run: |
          python build_static.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add fund_data.csv static/data/*.json index.html
          # Only commit if there are changes
          git commit -m "Auto-update: Daily Stats & History" || echo "No changes to commit"
          git push
